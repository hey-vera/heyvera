# Previously this file targeted npm at `/` and `/dashboard`. Neither exists —
# there is no root package.json and no dashboard directory — so both scheduled
# jobs failed every day, and the two real apps (cortex, heyvera) plus the whole
# Rust workspace got no scheduled updates at all.
#
# Note that repo-level "Dependabot security updates" scans every manifest in the
# tree regardless of what is configured here. That is why PRs kept arriving
# against archive/ — 357 package.json files live under a directory README.md
# marks "reference only, do not build from". Untracking archive/root-node-modules
# is what actually stops those; see the same PR as this change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cortex
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cortex-npm:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is ahead of the linter. `typescript-eslint` peers on
      # `typescript >=4.8.4 <6.1.0` on every published stable release, so a
      # bump to 7.x makes `npm ci` fail ERESOLVE before a single file is
      # compiled — which is exactly how PR #427 broke the required `cortex`
      # check. Lift this the day typescript-eslint widens its peer range.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: npm
    directory: /heyvera
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      heyvera-npm:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # Both need a code migration, and grouping them with thirty-odd harmless
      # bumps means none of the group can land — including security fixes.
      # Ignoring the majors here is not "never upgrade": it is "upgrade these
      # deliberately, in their own PR, where the diff is reviewable".
      #
      # rand's ignore is lifted: the 0.10 migration landed deliberately in
      # #474, and key generation no longer goes through rand_core, so a future
      # rand major cannot reach the crypto path the way this one did.
      #
      # x25519-dalek 2 -> 3 moves to rand_core 0.10 while our hybrid key
      # agreement is written against 0.6, and the compiler reports two type
      # mismatches beyond the RNG, so the API moved in more than one place.
      # The single call site is `X25519Secret::random_from_rng(rand_core::OsRng)`
      # in crates/soma-crypto/src/agreement.rs. The fix is likely the same
      # trick #474 used for ed25519 — generate 32 bytes and construct from
      # them, so no rand_core version can reach the crypto path — but this is
      # post-quantum hybrid key agreement and deserves a PR someone reads
      # rather than a line buried in thirty dependency bumps.
      - dependency-name: x25519-dalek
        update-types: ["version-update:semver-major"]
      # rusqlite 0.35 -> 0.40 spans several breaking releases and every
      # database call site in the workspace goes through it.
      - dependency-name: rusqlite
        update-types: ["version-update:semver-major"]

  # Grouped so action bumps arrive as one PR. Ungrouped, this produced five
  # separate stale branches that were never merged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
