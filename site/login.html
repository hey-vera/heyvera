<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ClawNet</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary:    #0a0a0b;
      --bg-surface:    #111113;
      --bg-surface-2:  #18181b;
      --border-subtle: #1e1e22;
      --border-default:#27272a;
      --border-strong: #3f3f46;
      --text-primary:  #fafafa;
      --text-secondary:#a1a1aa;
      --text-tertiary: #71717a;
      --text-muted:    #52525b;
      --accent:        #10b981;
      --accent-dim:    rgba(16,185,129,0.12);
      --accent-subtle: rgba(16,185,129,0.06);
      --accent-hover:  #34d399;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'JetBrains Mono', monospace;
      --radius-lg:     8px;
      --radius-md:     6px;
      --radius-sm:     4px;
    }
    [data-theme="light"] {
      --bg-primary: #f5f5f5; --bg-surface: #ffffff; --bg-surface-2: #f0f0f2;
      --border-subtle: #e4e4e7; --border-default: #d4d4d8; --border-strong: #a1a1aa;
      --text-primary: #09090b; --text-secondary: #3f3f46; --text-tertiary: #71717a; --text-muted: #a1a1aa;
      --accent-dim: rgba(16,185,129,0.10);
    }
    .nav-logo-text { font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; white-space: nowrap; }
    .nav-logo-text span { color: var(--accent); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg-primary); color:var(--text-primary); font-family:var(--font-sans); min-height:100vh; display:flex; flex-direction:column; }

    /* NAV */
    nav {
      display:flex; align-items:center; justify-content:space-between;
      height:56px; padding:0 24px;
      border-bottom:1px solid var(--border-subtle);
      background:rgba(10,10,11,0.95);
    }
    .nav-logo img { height:28px; display:block; }
    .nav-back { font-size:13px; color:var(--text-tertiary); text-decoration:none; transition:color 0.15s; }
    .nav-back:hover { color:var(--text-primary); }

    /* MAIN */
    .main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
    .auth-card {
      width:100%; max-width:400px;
      background:var(--bg-surface); border:1px solid var(--border-subtle);
      border-radius:var(--radius-lg); padding:40px 36px;
    }
    .auth-logo { display:flex; justify-content:center; margin-bottom:28px; }
    .auth-logo img { height:36px; }
    h1 { font-size:22px; font-weight:600; color:var(--text-primary); text-align:center; margin-bottom:6px; }
    .auth-sub { font-size:14px; color:var(--text-tertiary); text-align:center; margin-bottom:32px; }
    #clerk-sign-in { min-height:120px; }
    .auth-footer { text-align:center; margin-top:24px; font-size:13px; color:var(--text-tertiary); }
    .auth-footer a { color:var(--accent); text-decoration:none; }
    .auth-footer a:hover { color:var(--accent-hover); }

    /* FOOTER */
    footer {
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
      padding:20px 24px; border-top:1px solid var(--border-subtle);
      font-size:12px; color:var(--text-muted);
    }
    .footer-links { display:flex; gap:16px; list-style:none; }
    .footer-links a { color:var(--text-muted); text-decoration:none; }
    .footer-links a:hover { color:var(--text-secondary); }
  </style>
  <script>if(localStorage.getItem('clawnet_theme')==='light')document.documentElement.setAttribute('data-theme','light')</script>
</head>
<body>
<nav>
  <a href="/" class="nav-logo"><span class="nav-logo-text">Claw <span>Network</span></span></a>
  <a href="/" class="nav-back">← Back to Home</a>
</nav>

<div class="main">
  <div class="auth-card">
    <div class="auth-logo"><span class="nav-logo-text">Claw <span>Network</span></span></div>
    <h1>Sign in to ClawNet</h1>
    <p class="auth-sub">Access your API key, credits, and skill marketplace.</p>
    <div id="clerk-sign-in"></div>
    <div style="margin-top:16px; font-size:11px; color:var(--text-muted); text-align:center; line-height:1.5;">
      Signing in with X? Disable ad blockers for x.com if the page loops.
    </div>
    <div class="auth-footer">
      New here? <a href="#" id="sign-up-link">Create an account</a>
    </div>
  </div>
</div>

<footer>
  <ul class="footer-links">
    <li><a href="/">Home</a></li>
    <li><a href="/docs">Docs</a></li>
    <li><a href="/marketplace">Skills</a></li>
    <li><a href="/dashboard">Dashboard</a></li>
  </ul>
  <span>&copy; 2026 ClawNet &middot; Powered by x402</span>
</footer>

<script src="/clerk-recovery.js"></script>
<script data-clerk-publishable-key="pk_live_Y2xlcmsuY2xhdy1uZXQub3JnJA"
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
<script>
  const CLAIM_SESSION = new URLSearchParams(window.location.search).get('claim');
  const REDIRECT = CLAIM_SESSION
    ? `/dashboard?claim_session=${CLAIM_SESSION}`
    : `/dashboard.html`;

  window.addEventListener('load', async () => {
    // Handle stale session / OAuth callback errors — sign out and retry
    const url = new URL(window.location.href);
    if (url.searchParams.get('err_code') || url.hash.includes('err_code')) {
      try { await window.Clerk.load(); await window.Clerk.signOut(); } catch { clearClerkCookies(); }
      window.location.href = '/login';
      return;
    }

    if (!await loadClerkSafe()) {
      document.getElementById('clerk-sign-in').innerHTML = '<p style="color:var(--danger);font-size:13px">Authentication error. <a href="/login" style="color:var(--accent)">Try again</a></p>';
      return;
    }

    if (window.Clerk.user) {
      window.location.href = REDIRECT;
      return;
    }
    window.Clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
      afterSignInUrl: REDIRECT,
      afterSignUpUrl: REDIRECT,
    });
    document.getElementById('sign-up-link').addEventListener('click', (e) => {
      e.preventDefault();
      window.Clerk.openSignUp({ afterSignUpUrl: REDIRECT });
    });
  });
</script>
</body>
</html>
