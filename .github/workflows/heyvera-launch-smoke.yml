name: HeyVera Launch Smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Smoke gate mode
        required: true
        default: pre-proxy
        type: choice
        options:
          - pre-proxy
          - post-proxy

permissions:
  contents: read

concurrency:
  group: heyvera-launch-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run public HeyVera smoke gate
        env:
          HEYVERA_SMOKE_MODE: ${{ inputs.mode }}
        run: bash scripts/heyvera-launch-smoke.sh
