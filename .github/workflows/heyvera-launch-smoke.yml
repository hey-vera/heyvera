name: HeyVera Launch Smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Smoke gate mode
        required: true
        default: pre-proxy
        type: choice
        options:
          - pre-proxy
          - post-proxy

permissions:
  contents: read

concurrency:
  group: heyvera-launch-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run public HeyVera smoke gate
        env:
          HEYVERA_SMOKE_MODE: ${{ inputs.mode }}
        run: bash scripts/heyvera-launch-smoke.sh
