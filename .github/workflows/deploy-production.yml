name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: clawnet-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync GitHub commit to server mirror
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          test -n "$TAILSCALE_HOST"
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          git remote add server-mirror "ssh://${DEPLOY_USER}@${TAILSCALE_HOST}/home/${DEPLOY_USER}/claw-net.git"
          git push --force server-mirror "HEAD:refs/heads/${{ inputs.branch }}"

      - name: Deploy ClawNet
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          test -n "$TAILSCALE_HOST"
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "cd /home/${DEPLOY_USER}/claw-net && git fetch origin '${{ inputs.branch }}' && git checkout '${{ inputs.branch }}' && git reset --hard 'origin/${{ inputs.branch }}' && DEPLOY_USER='${DEPLOY_USER}' GIT_BRANCH='${{ inputs.branch }}' AUTO_SWITCH_BRANCH=1 GITHUB_DEPLOY_RUN_ID='${{ github.run_id }}' GITHUB_DEPLOY_RUN_NUMBER='${{ github.run_number }}' GITHUB_DEPLOY_RUN_ATTEMPT='${{ github.run_attempt }}' GITHUB_DEPLOY_WORKFLOW='${{ github.workflow }}' GITHUB_DEPLOY_EVENT='${{ github.event_name }}' GITHUB_DEPLOY_SERVER_URL='${{ github.server_url }}' GITHUB_DEPLOY_REPOSITORY='${{ github.repository }}' GITHUB_DEPLOY_ACTOR='${{ github.actor }}' GITHUB_DEPLOY_SHA='${{ github.sha }}' bash scripts/deploy.sh"

      - name: Verify production APIs
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          test -n "$TAILSCALE_HOST"
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors http://localhost:3001/v1/health && curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors 'http://localhost:3001/v1/social/longform?limit=1' && (curl --fail --silent --show-error http://localhost:3402/v1/health || echo '[verify] Legacy ClawNet API on 3402 is not active; skipped')"
