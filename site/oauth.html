<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize — ClawNet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { max-width: 440px; width: 90%; text-align: center; }
    .card.authorize { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; }
    h1 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 8px; }
    .app-name { color: #d29922; font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; }
    p { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
    ul { text-align: left; color: #c9d1d9; font-size: 0.88rem; margin: 0 auto 24px; max-width: 280px; list-style: none; }
    ul li { padding: 6px 0; }
    ul li::before { content: '✓'; color: #238636; margin-right: 8px; font-weight: 700; }
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 12px; transition: background 0.15s; }
    .btn-authorize { background: #238636; color: #fff; }
    .btn-authorize:hover { background: #2ea043; }
    .btn-cancel { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
    .btn-cancel:hover { background: #30363d; color: #e6edf3; }
    .error { color: #f85149; font-size: 0.85rem; margin-bottom: 16px; padding: 10px; background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.2); border-radius: 6px; }
    .loading { color: #8b949e; }
    #signin-section { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ClawNet</h1>
    <div id="content">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <script src="/clerk-recovery.js"></script>
  <script data-clerk-publishable-key="pk_live_Y2xlcmsuY2xhdy1uZXQub3JnJA"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
  <script>
    window.addEventListener('load', async function() {
      const clerk = window.Clerk;
      if (!await loadClerkSafe()) {
        document.getElementById('content').innerHTML = '<div class="error">Authentication error. <a href="/oauth' + location.search + '">Try again</a></div>';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const app = params.get('app');
      const redirect = params.get('redirect');
      const content = document.getElementById('content');

      // Validate params
      if (!app || !redirect) {
        content.innerHTML = '<div class="error">Missing app or redirect parameter.</div><a href="/" class="btn btn-cancel">Go Home</a>';
        return;
      }

      const appNames = { pulse: 'Pulse — AI Marketing Agent', radar: 'Radar — AI Trading Agent' };
      const appName = appNames[app] || app;

      // Check if signed in
      if (!clerk.user) {
        document.querySelector('.card h1').style.display = 'none';
        content.innerHTML = `
          <p class="app-name">${appName}</p>
          <p>Sign in to your ClawNet account to continue.</p>
          <div id="signin-section"></div>
        `;
        clerk.mountSignIn(document.getElementById('signin-section'), {
          appearance: {
            variables: {
              colorPrimary: '#238636',
              colorBackground: '#161b22',
              colorText: '#e6edf3',
              colorInputBackground: '#0d1117',
              colorInputText: '#e6edf3',
            },
            elements: {
              socialButtonsBlockButton: {
                background: '#21262d',
                border: '1px solid #30363d',
                color: '#e6edf3',
              },
              socialButtonsBlockButtonText: {
                color: '#e6edf3',
              },
              socialButtonsBlockButton__apple: {
                background: '#21262d',
              },
            },
          },
          afterSignInUrl: window.location.href,
        });
        return;
      }

      // User is signed in — show authorize page
      document.querySelector('.card').classList.add('authorize');
      content.innerHTML = `
        <p class="app-name">${appName}</p>
        <p><strong>${appName}</strong> wants to access your ClawNet account.</p>
        <ul>
          <li>Read your account info</li>
          <li>Use credits for AI actions</li>
          <li>Access your API key</li>
        </ul>
        <button id="authorize-btn" class="btn btn-authorize">Authorize ${app.charAt(0).toUpperCase() + app.slice(1)}</button>
        <a href="${redirect.split('?')[0].replace('/auth/callback', '')}" class="btn btn-cancel">Cancel</a>
        <p style="color:#8b949e;font-size:0.75rem;margin-top:12px;">Signed in as ${clerk.user.primaryEmailAddress?.emailAddress || clerk.user.id}</p>
        <button id="switch-btn" class="btn btn-cancel" style="margin-top:8px;font-size:0.78rem;padding:6px 16px;width:auto;">Switch Account</button>
      `;

      document.getElementById('switch-btn').addEventListener('click', async function() {
        await clerk.signOut();
        window.location.reload();
      });

      document.getElementById('authorize-btn').addEventListener('click', async function() {
        this.disabled = true;
        this.textContent = 'Authorizing...';

        try {
          // Get session token
          const token = await clerk.session.getToken();

          // Call API to create auth code
          const res = await fetch('https://api.claw-net.org/v1/oauth/authorize', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ app: app, redirect: redirect }),
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({ error: 'Authorization failed' }));
            content.innerHTML = '<div class="error">' + (err.error || 'Authorization failed') + '</div><a href="' + redirect.split('?')[0].replace('/auth/callback', '') + '" class="btn btn-cancel">Go Back</a>';
            return;
          }

          const data = await res.json();
          if (data.redirect) {
            window.location.href = data.redirect;
          } else if (data.code) {
            window.location.href = redirect + (redirect.includes('?') ? '&' : '?') + 'code=' + data.code;
          } else {
            content.innerHTML = '<div class="error">Unexpected response from server.</div>';
          }
        } catch (err) {
          content.innerHTML = '<div class="error">Network error. Please try again.</div><a href="' + window.location.href + '" class="btn btn-cancel">Retry</a>';
        }
      });
    });
  </script>
</body>
</html>
