[package]
name = "cortex-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP API server for Cortex orchestration engine"

[lib]
name = "cortex_api"
path = "src/lib.rs"

[[bin]]
name = "cortex-server"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../core" }
cortex-engine = { path = "../engine" }
cortex-context = { path = "../context" }
cortex-worker = { path = "../worker" }
soma = { path = "../soma" }
soma-core = { path = "../soma-core" }
dirs-next = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
futures-core.workspace = true
tokio-stream.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
async-stream.workspace = true
base64.workspace = true
aes-gcm.workspace = true
rand.workspace = true
futures-util.workspace = true
which = "8"
bollard = "0.21"
socket2 = "0.6"
prometheus.workspace = true
once_cell.workspace = true
sentry = { version = "0.49", features = ["tracing"], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true, features = ["tonic"] }
tracing-opentelemetry = { version = "0.33", optional = true }

[features]
sentry-tracking = ["sentry"]
otel = ["opentelemetry", "opentelemetry-otlp", "tracing-opentelemetry"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
