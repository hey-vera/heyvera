name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'heyvera/**'
      - 'Caddyfile'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heyvera-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: heyvera/package-lock.json

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || vars.PUBLIC_API_URL || 'https://api.heyvera.org' }}
        run: |
          cd heyvera
          npm ci
          npm run build

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy frontend to server
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          test -n "$TAILSCALE_HOST"
          TARGET="/home/${DEPLOY_USER}/www/heyvera"

          # Caddy serves the deploy user's home path because this account cannot
          # create /var/www/heyvera without an interactive sudo password.
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "mkdir -p ${TARGET}"

          echo "Deploying to ${TARGET}"

          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            heyvera/dist/ \
            "${DEPLOY_USER}@${TAILSCALE_HOST}:${TARGET}/"

      - name: Update Caddyfile and reload
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            Caddyfile \
            "${DEPLOY_USER}@${TAILSCALE_HOST}:/tmp/Caddyfile.new"

          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "caddy validate --config /tmp/Caddyfile.new && sudo -n cp /tmp/Caddyfile.new /etc/caddy/Caddyfile && sudo -n systemctl reload caddy && echo '[caddy] Reloaded' || echo '[caddy] sudo unavailable — Caddyfile not updated, reload manually'"

      - name: Smoke deployed files
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" <<'EOF'
          set -euo pipefail
          ROOT="/home/$USER/www/heyvera"
          test -f "$ROOT/index.html"
          ASSET=$(grep -o '/assets/[^"]*\.js' "$ROOT/index.html" \
            | head -n 1)
          test -n "$ASSET"
          test -f "$ROOT${ASSET}"
          EOF
