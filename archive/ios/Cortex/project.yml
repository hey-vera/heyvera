# XcodeGen spec — run `xcodegen generate` (or `brew install xcodegen`) to produce Cortex.xcodeproj.
# Keeping the project as a declarative spec makes the Xcode project reproducible and reviewable in git.
name: Cortex
options:
  bundleIdPrefix: org.heyvera.cortex
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your team id in Xcode signing
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Cortex:
    type: application
    platform: iOS
    sources:
      - path: Cortex
    configFiles:
      Debug: Cortex/Config/Cortex.xcconfig
      Release: Cortex/Config/Cortex.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.heyvera.cortex
        INFOPLIST_FILE: Cortex/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Cortex/App/Info.plist
