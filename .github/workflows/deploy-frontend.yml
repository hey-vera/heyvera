name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Caddyfile'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heyvera-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy frontend to server
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          test -n "$TAILSCALE_HOST"

          # Ensure target dir exists — try sudo first, fall back to home dir
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "sudo -n mkdir -p /var/www/heyvera && sudo -n chown -R ${DEPLOY_USER}:${DEPLOY_USER} /var/www/heyvera || mkdir -p \$HOME/www/heyvera"

          # Determine actual target path
          TARGET=$(ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "[ -d /var/www/heyvera ] && echo /var/www/heyvera || echo \$HOME/www/heyvera")

          echo "Deploying to ${TARGET}"

          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            web/dist/ \
            "${DEPLOY_USER}@${TAILSCALE_HOST}:${TARGET}/"

      - name: Update Caddyfile and reload
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            Caddyfile \
            "${DEPLOY_USER}@${TAILSCALE_HOST}:/tmp/Caddyfile.new"

          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "caddy validate --config /tmp/Caddyfile.new && sudo -n cp /tmp/Caddyfile.new /etc/caddy/Caddyfile && sudo -n systemctl reload caddy && echo '[caddy] Reloaded' || echo '[caddy] sudo unavailable — Caddyfile not updated, reload manually'"
