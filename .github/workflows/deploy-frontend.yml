name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Caddyfile'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heyvera-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy frontend to server
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          test -n "$TAILSCALE_HOST"
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"

          # Create target directory and rsync built files
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "sudo mkdir -p /var/www/heyvera"

          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            web/dist/ \
            "${DEPLOY_USER}@${TAILSCALE_HOST}:/var/www/heyvera/"

      - name: Update Caddyfile and reload
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          TAILSCALE_HOST: ${{ vars.TAILSCALE_HOST }}
        run: |
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"

          # Copy Caddyfile and reload Caddy
          scp -o StrictHostKeyChecking=accept-new \
            Caddyfile \
            "${DEPLOY_USER}@${TAILSCALE_HOST}:/tmp/Caddyfile.new"

          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${TAILSCALE_HOST}" \
            "caddy validate --config /tmp/Caddyfile.new && sudo cp /tmp/Caddyfile.new /etc/caddy/Caddyfile && sudo systemctl reload caddy && echo '[caddy] Reloaded'"
