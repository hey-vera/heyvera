services:
  orchestrator:
    build: .
    ports:
      - "3402:3402"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./prover/target/release/soma-nova-prover:/app/prover/target/release/soma-nova-prover:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Process has a 15s drain + cron/mesh/DB/Redis cleanup before 30s force-exit.
    # Docker default stop_grace_period is 10s — SIGKILL fires during drain, killing
    # in-flight requests and skipping WAL checkpoint. Set to 40s > 30s force-exit.
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3402/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3.5G
          cpus: '2.0'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      sh -c "redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
      $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 3